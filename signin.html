<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Metallurgeon - Sign In</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Flowbite -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</head>

<body class="bg-gray-100">


    <!-- NAVBAR -->
    <nav class="bg-white shadow">

        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="index.html"
                class="text-2xl font-bold bg-gradient-to-r from-indigo-600 via-indigo-500 to-indigo-400 bg-clip-text text-transparent">
                Metallurgeon
            </a>

            <div class="flex gap-6 items-center">

                <a href="index.html" class="hover:text-indigo-600">
                    Home
                </a>

                <a href="about.html" class="hover:text-indigo-600">
                    About
                </a>

                <a href="contact.html" class="hover:text-indigo-600">
                    Contact
                </a>

                <a href="signup.html" class="hover:text-indigo-600">
                    Sign Up
                </a>

                <a href="signin.html"
                    class="bg-indigo-600 text-white px-4 py-2 rounded-lg">
                    Sign In
                </a>

            </div>

        </div>

    </nav>


    <!-- HEADER -->
    <section class="bg-indigo-400 text-white text-center py-16">

        <h1 class="text-4xl font-bold mb-3">
            Welcome Back
        </h1>

        <p class="text-indigo-100">
            Sign in to your Metallurgeon account.
        </p>

    </section>


    <!-- SIGN IN -->
    <section class="max-w-md mx-auto px-6 py-16">

        <div class="bg-white rounded-2xl shadow-xl p-8">


            <!-- ICON -->
            <div
                class="w-16 h-16 mx-auto bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mb-6">

                👤

            </div>


            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">
                Sign In
            </h2>

            <p class="text-gray-500 text-center mb-8">
                Access your Metallurgeon account.
            </p>


            <form onsubmit="return signinValidation()"
                class="space-y-6">


                <!-- EMAIL -->
                <div>

                    <label for="email"
                        class="block mb-2 text-sm font-semibold text-gray-700">

                        Email Address

                    </label>

                    <input type="email"
                        id="email"
                        required
                        placeholder="Enter your email"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <!-- PASSWORD -->
                <div>

                    <label for="password"
                        class="block mb-2 text-sm font-semibold text-gray-700">

                        Password

                    </label>

                    <input type="password"
                        id="password"
                        required
                        minlength="8"
                        placeholder="Enter your password"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">

                </div>


                <!-- REMEMBER / FORGOT -->
                <div class="flex items-center justify-between">

                    <div class="flex items-center gap-2">

                        <input type="checkbox"
                            id="remember"
                            class="w-4 h-4 accent-indigo-600">

                        <label for="remember"
                            class="text-sm text-gray-600">

                            Remember me

                        </label>

                    </div>


                    <a href="#"
                        class="text-sm text-indigo-600 hover:underline">

                        Forgot password?

                    </a>

                </div>


                <!-- SIGN IN BUTTON -->
                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">

                    Sign In

                </button>


                <!-- SIGN UP -->
                <p class="text-center text-gray-600 text-sm">

                    Don't have an account?

                    <a href="signup.html"
                        class="text-indigo-600 font-semibold hover:underline">

                        Sign up.

                    </a>

                </p>

            </form>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="bg-gray-900 text-white text-center py-8">

        <h2 class="text-xl font-bold">
            Metallurgeon
        </h2>

        <div class="flex justify-center gap-6 my-4">

            <a href="index.html" class="hover:text-indigo-400">
                Home
            </a>

            <a href="about.html" class="hover:text-indigo-400">
                About
            </a>

            <a href="contact.html" class="hover:text-indigo-400">
                Contact
            </a>

        </div>

        <p class="text-gray-400">
            © 2026 Metallurgeon. All rights reserved.
        </p>

    </footer>


    <!-- VALIDATION -->
    <script>

        function signinValidation() {

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;


            if (email === "" || password === "") {

                alert("Please fill in all fields.");

                return false;

            }


            alert("Sign in successful!");

            return false;

        }

    </script>

</body>
</html>
